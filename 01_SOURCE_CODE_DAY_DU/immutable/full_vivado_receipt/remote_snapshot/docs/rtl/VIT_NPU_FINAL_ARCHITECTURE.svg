<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1150" viewBox="0 0 1920 1150" role="img" aria-labelledby="title desc">
  <title id="title">ViT-Base/16-224 NPU M4-R8 Architecture for Genesys ZU-5EV</title>
  <desc id="desc">M4-R8 dataflow from image preprocessing and packed model in DDR, through exact ZynqMP AXI ports, to the synthesizable ViT NPU hierarchy and classification result. Production geometry is R8 C2 L16 with scalar 32-bit AXI. The bundle rebuilds and validates the PS and DDR Block Design from Tcl; R8 route and board acceptance remain pending until exact-manifest evidence passes. DSP zero remains a mandatory post-netlist gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="psFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#fff1c7"/>
    </linearGradient>
    <linearGradient id="plFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f8ff"/>
      <stop offset="1" stop-color="#e4f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#24466c" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#2368a2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#23856d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#c76b18"/>
    </marker>
    <style>
      .title { font: 700 30px "DejaVu Sans", sans-serif; fill: #18324f; }
      .subtitle { font: 500 16px "DejaVu Sans", sans-serif; fill: #52677d; }
      .section { font: 700 20px "DejaVu Sans", sans-serif; fill: #24466c; }
      .boxTitle { font: 700 16px "DejaVu Sans", sans-serif; fill: #18324f; }
      .body { font: 500 13px "DejaVu Sans", sans-serif; fill: #314a63; }
      .small { font: 500 12px "DejaVu Sans", sans-serif; fill: #52677d; }
      .tiny { font: 500 11px "DejaVu Sans", sans-serif; fill: #52677d; }
      .blockTitle { font: 700 12px "DejaVu Sans", sans-serif; fill: #18324f; }
      .blockTiny { font: 500 10px "DejaVu Sans", sans-serif; fill: #52677d; }
      .mono { font: 600 12px "DejaVu Sans Mono", monospace; fill: #263f59; }
      .whiteTitle { font: 700 16px "DejaVu Sans", sans-serif; fill: #ffffff; }
      .whiteBody { font: 500 12px "DejaVu Sans", sans-serif; fill: #f6fbff; }
      .flow { fill: none; stroke: #2368a2; stroke-width: 3; marker-end: url(#arrowBlue); }
      .flowBi { fill: none; stroke: #23856d; stroke-width: 4; marker-start: url(#arrowGreen); marker-end: url(#arrowGreen); }
      .control { fill: none; stroke: #c76b18; stroke-width: 3; marker-end: url(#arrowOrange); }
      .controlBi { fill: none; stroke: #c76b18; stroke-width: 3; marker-start: url(#arrowOrange); marker-end: url(#arrowOrange); }
      .metadata { fill: none; stroke: #c76b18; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowOrange); }
      .thin { fill: none; stroke: #6b879f; stroke-width: 2; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1920" height="1150" fill="url(#bg)"/>
  <text x="960" y="47" text-anchor="middle" class="title">ViT-Base/16-224 NPU — Final Target Architecture</text>
  <text x="960" y="75" text-anchor="middle" class="subtitle">Genesys ZU-5EV · M4-R8 (R8×C2×L16) · exact-manifest BD/route/board gates required</text>

  <rect x="36" y="112" width="325" height="816" rx="22" fill="#ffffff" stroke="#9ab1c8" stroke-width="2" filter="url(#shadow)"/>
  <text x="198" y="150" text-anchor="middle" class="section">HOST / OFFLINE</text>

  <rect x="74" y="180" width="247" height="82" rx="14" fill="#edf6ff" stroke="#5c93c4" stroke-width="2"/>
  <text x="197" y="213" text-anchor="middle" class="boxTitle">Ảnh RGB bất kỳ</text>
  <text x="197" y="238" text-anchor="middle" class="body">JPEG / PNG / BMP</text>
  <path d="M197 263 L197 295" class="flow"/>

  <rect x="58" y="301" width="279" height="119" rx="14" fill="#eaf8f4" stroke="#4b9b86" stroke-width="2"/>
  <text x="197" y="329" text-anchor="middle" class="boxTitle">Python / PS preprocessing</text>
  <text x="197" y="354" text-anchor="middle" class="body">resize 224×224 · RGB · normalize</text>
  <text x="197" y="377" text-anchor="middle" class="body">patchify 16×16 · unfold layout</text>
  <text x="197" y="400" text-anchor="middle" class="mono">FP32 [1,196,768]</text>
  <path d="M197 421 L197 453" class="flow"/>

  <rect x="58" y="459" width="279" height="93" rx="14" fill="#f3efff" stroke="#8267bd" stroke-width="2"/>
  <text x="197" y="490" text-anchor="middle" class="boxTitle">Prepared input tensor</text>
  <text x="197" y="515" text-anchor="middle" class="mono">150,528 FP32 words</text>
  <text x="197" y="536" text-anchor="middle" class="small">patch-major input, không phải raster</text>

  <rect x="58" y="605" width="279" height="152" rx="14" fill="#fff2e8" stroke="#ce7b39" stroke-width="2"/>
  <text x="197" y="635" text-anchor="middle" class="boxTitle">Model packer</text>
  <text x="197" y="660" text-anchor="middle" class="body">200 parameter tensors thật</text>
  <text x="197" y="686" text-anchor="middle" class="mono">vit_model.bin</text>
  <text x="197" y="705" text-anchor="middle" class="small">tensor payload đưa vào DDR</text>
  <text x="197" y="726" text-anchor="middle" class="mono">vit_model_table.bin + manifest</text>
  <text x="197" y="746" text-anchor="middle" class="tiny">offset/size metadata do PS lập trình</text>

  <rect x="58" y="781" width="279" height="107" rx="14" fill="#f7f8fa" stroke="#8b98a7" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="197" y="811" text-anchor="middle" class="boxTitle">Behavioral full-model golden</text>
  <text x="197" y="836" text-anchor="middle" class="body">đã chạy đúng · giữ nguyên</text>
  <text x="197" y="860" text-anchor="middle" class="small">chỉ comparator, không synthesis</text>

  <rect x="395" y="112" width="1488" height="974" rx="24" fill="#fafdff" stroke="#53789c" stroke-width="3" filter="url(#shadow)"/>
  <text x="1139" y="145" text-anchor="middle" class="section">GENESYS ZU-5EV · Zynq UltraScale+ MPSoC TARGET</text>

  <rect x="423" y="169" width="429" height="883" rx="20" fill="url(#psFill)" stroke="#cf9d30" stroke-width="2"/>
  <text x="638" y="204" text-anchor="middle" class="section">PROCESSING SYSTEM (PS)</text>

  <rect x="454" y="224" width="367" height="145" rx="14" fill="#ffffff" stroke="#d1a540" stroke-width="2"/>
  <text x="637" y="251" text-anchor="middle" class="boxTitle">A53 software (board target)</text>
  <text x="637" y="276" text-anchor="middle" class="body">load input + vit_model.bin payload to DDR</text>
  <text x="637" y="298" text-anchor="middle" class="body">parse table · program base/limit + layer RAM</text>
  <text x="637" y="320" text-anchor="middle" class="body">start job · wait done/IRQ</text>
  <text x="637" y="342" text-anchor="middle" class="small">simulation: AXI BFM replaces A53 + physical DDR</text>

  <rect x="454" y="388" width="367" height="350" rx="16" fill="#fffdf7" stroke="#cf9d30" stroke-width="2"/>
  <text x="637" y="420" text-anchor="middle" class="boxTitle">External DDR4 address space</text>
  <rect x="480" y="450" width="315" height="70" rx="11" fill="#eaf8f4" stroke="#4b9b86" stroke-width="2"/>
  <text x="637" y="478" text-anchor="middle" class="boxTitle">INPUT region</text>
  <text x="637" y="502" text-anchor="middle" class="mono">150,528 × FP32</text>
  <rect x="480" y="536" width="315" height="77" rx="11" fill="#fff2e8" stroke="#ce7b39" stroke-width="2"/>
  <text x="637" y="564" text-anchor="middle" class="boxTitle">MODEL region</text>
  <text x="637" y="586" text-anchor="middle" class="body">vit_model.bin: tensor payload only</text>
  <text x="637" y="604" text-anchor="middle" class="tiny">offset metadata remains under PS control</text>
  <rect x="480" y="629" width="315" height="82" rx="11" fill="#edf6ff" stroke="#5c93c4" stroke-width="2"/>
  <text x="637" y="657" text-anchor="middle" class="boxTitle">SCRATCH / OUTPUT region</text>
  <text x="637" y="681" text-anchor="middle" class="mono">1,990,656 × FP32 words</text>
  <text x="637" y="701" text-anchor="middle" class="tiny">HIDDEN A/B · Q/K/V · SCORE · FC · LOGIT/PROB</text>

  <rect x="454" y="785" width="367" height="92" rx="14" fill="#ffffff" stroke="#d1a540" stroke-width="2"/>
  <text x="637" y="816" text-anchor="middle" class="boxTitle">PS↔PL interconnect</text>
  <text x="637" y="842" text-anchor="middle" class="body">M_AXI_HPM0_FPD → NPU S_AXI</text>
  <text x="637" y="864" text-anchor="middle" class="small">NPU M_AXI → S_AXI_HP0_FPD → DDR</text>

  <rect x="454" y="896" width="367" height="50" rx="12" fill="#274d73"/>
  <text x="637" y="918" text-anchor="middle" class="whiteBody">AXI4-Lite register readback</text>
  <text x="637" y="938" text-anchor="middle" class="whiteTitle">class_index · class_logit · done</text>
  <rect x="544" y="958" width="277" height="27" rx="10" fill="#fff2e8" stroke="#ce7b39" stroke-width="2"/>
  <text x="682" y="977" text-anchor="middle" class="small">irq_o: direct PL → PS interrupt only</text>

  <rect x="886" y="169" width="968" height="883" rx="20" fill="url(#plFill)" stroke="#3e82bb" stroke-width="2"/>
  <text x="1370" y="204" text-anchor="middle" class="section">PROGRAMMABLE LOGIC (PL)</text>
  <rect x="914" y="228" width="912" height="796" rx="18" fill="#ffffff" stroke="#4f8fc2" stroke-width="3"/>
  <text x="1370" y="258" text-anchor="middle" class="boxTitle">vit_phase_e_axi_bd_wrapper</text>

  <rect x="928" y="274" width="884" height="648" rx="17" fill="#f4f9fe" stroke="#6396bd" stroke-width="2"/>
  <text x="1370" y="302" text-anchor="middle" class="boxTitle">vit_phase_e_axi_wrapper</text>

  <rect x="948" y="325" width="200" height="166" rx="14" fill="#fff6df" stroke="#d09a26" stroke-width="2"/>
  <text x="1048" y="350" text-anchor="middle" class="boxTitle">AXI4-Lite control</text>
  <text x="1048" y="372" text-anchor="middle" class="tiny">vit_axi_lite_control_regs</text>
  <text x="1048" y="397" text-anchor="middle" class="small">control/status registers</text>
  <text x="1048" y="419" text-anchor="middle" class="small">base + limit registers</text>
  <text x="1048" y="441" text-anchor="middle" class="small">layer param RAM 192×32</text>
  <text x="1048" y="463" text-anchor="middle" class="small">readback: done · class · logit</text>

  <rect x="948" y="526" width="200" height="149" rx="14" fill="#eaf8f4" stroke="#348d76" stroke-width="2"/>
  <text x="1048" y="551" text-anchor="middle" class="boxTitle">M_AXI adapter</text>
  <text x="1048" y="573" text-anchor="middle" class="tiny">vit_phase_e_axi_mem_adapter</text>
  <text x="1048" y="600" text-anchor="middle" class="tiny">logical word ↔ AXI byte</text>
  <text x="1048" y="622" text-anchor="middle" class="tiny">MODEL · INPUT · SCRATCH</text>
  <text x="1048" y="644" text-anchor="middle" class="tiny">32-bit single-beat · stable handshake</text>

  <rect x="1171" y="325" width="626" height="581" rx="18" fill="#f8fbff" stroke="#346f9f" stroke-width="2"/>
  <text x="1484" y="354" text-anchor="middle" class="boxTitle">vit_phase_e_npu</text>

  <rect x="1200" y="375" width="252" height="76" rx="12" fill="#fff2e8" stroke="#ce7b39" stroke-width="2"/>
  <text x="1326" y="405" text-anchor="middle" class="boxTitle">ViT sequencer FSM</text>
  <text x="1326" y="430" text-anchor="middle" class="small">E01 / E02 / E03 / E04 / E05</text>
  <rect x="1516" y="375" width="252" height="76" rx="12" fill="#fff2e8" stroke="#ce7b39" stroke-width="2"/>
  <text x="1642" y="405" text-anchor="middle" class="boxTitle">512-bit command</text>
  <text x="1642" y="430" text-anchor="middle" class="small">opcode · address · dims · strides</text>
  <path d="M1453 413 L1505 413" class="control"/>

  <rect x="1200" y="479" width="568" height="407" rx="16" fill="#eef6fd" stroke="#4f8fc2" stroke-width="2"/>
  <text x="1484" y="508" text-anchor="middle" class="boxTitle">vit_phase_e_engine_top</text>
  <rect x="1225" y="529" width="228" height="77" rx="11" fill="#ffffff" stroke="#7098b8" stroke-width="2"/>
  <text x="1339" y="557" text-anchor="middle" class="boxTitle">Command controller</text>
  <text x="1339" y="582" text-anchor="middle" class="small">accept · dispatch · done/error</text>
  <rect x="1515" y="529" width="228" height="77" rx="11" fill="#ffffff" stroke="#7098b8" stroke-width="2"/>
  <text x="1629" y="557" text-anchor="middle" class="boxTitle">Memory frontend</text>
  <text x="1629" y="582" text-anchor="middle" class="small">gather/scatter · A/bias cache</text>
  <rect x="1225" y="643" width="518" height="143" rx="13" fill="#ffffff" stroke="#7098b8" stroke-width="2"/>
  <text x="1484" y="671" text-anchor="middle" class="boxTitle">Compute blocks — one active opcode at a time</text>
  <rect x="1231" y="692" width="68" height="66" rx="8" fill="#eaf8f4" stroke="#4b9b86"/>
  <text x="1265" y="718" text-anchor="middle" class="blockTitle">GEMM</text>
  <text x="1265" y="739" text-anchor="middle" class="blockTiny">serial dot16</text>
  <rect x="1304" y="692" width="68" height="66" rx="8" fill="#f3efff" stroke="#8267bd"/>
  <text x="1338" y="718" text-anchor="middle" class="blockTitle">Vector</text>
  <text x="1338" y="739" text-anchor="middle" class="blockTiny">add / scale</text>
  <rect x="1377" y="692" width="68" height="66" rx="8" fill="#edf6ff" stroke="#5c93c4"/>
  <text x="1411" y="718" text-anchor="middle" class="blockTitle">Layout</text>
  <text x="1411" y="739" text-anchor="middle" class="blockTiny">transpose</text>
  <rect x="1450" y="692" width="68" height="66" rx="8" fill="#fff2e8" stroke="#ce7b39"/>
  <text x="1484" y="718" text-anchor="middle" class="blockTitle">LayerNorm</text>
  <text x="1484" y="739" text-anchor="middle" class="blockTiny">3 passes</text>
  <rect x="1523" y="692" width="68" height="66" rx="8" fill="#eaf8f4" stroke="#4b9b86"/>
  <text x="1557" y="718" text-anchor="middle" class="blockTitle">Softmax</text>
  <text x="1557" y="739" text-anchor="middle" class="blockTiny">3 passes</text>
  <rect x="1596" y="692" width="68" height="66" rx="8" fill="#f3efff" stroke="#8267bd"/>
  <text x="1630" y="718" text-anchor="middle" class="blockTitle">GELU</text>
  <text x="1630" y="739" text-anchor="middle" class="blockTiny">serial lane</text>
  <rect x="1669" y="692" width="68" height="66" rx="8" fill="#edf6ff" stroke="#5c93c4"/>
  <text x="1703" y="718" text-anchor="middle" class="blockTitle">Argmax</text>
  <text x="1703" y="739" text-anchor="middle" class="blockTiny">class select</text>

  <rect x="1225" y="806" width="518" height="76" rx="12" fill="#274d73"/>
  <text x="1484" y="831" text-anchor="middle" class="whiteTitle">Leaf arithmetic service — shared in production</text>
  <text x="1484" y="853" text-anchor="middle" class="whiteBody">1× FP32 LUT multiplier + 1× FP32 adder shared by the active block</text>
  <text x="1484" y="872" text-anchor="middle" class="whiteBody">compare · shift · counter · iterative u32 multiply — fabric-only intent</text>

  <path d="M337 506 C390 506 410 486 470 486" class="flow"/>
  <text x="400" y="478" text-anchor="middle" class="small">load input</text>
  <path d="M337 665 C396 665 418 574 470 574" class="flow"/>
  <text x="405" y="637" text-anchor="middle" class="small">vit_model.bin → DDR</text>
  <path d="M337 620 L378 620 L378 210 L430 210 L430 260 L444 260" class="metadata"/>
  <text x="373" y="417" text-anchor="middle" class="small" transform="rotate(-90 373 417)">table / manifest metadata → PS</text>
  <path d="M821 320 C873 320 895 398 938 398" class="controlBi"/>
  <text x="880" y="309" text-anchor="middle" class="small">M_AXI_HPM0_FPD → NPU S_AXI</text>
  <path d="M938 600 C890 600 875 828 821 828" class="flowBi"/>
  <text x="881" y="718" text-anchor="middle" class="small" transform="rotate(-90 881 718)">NPU M_AXI → S_AXI_HP0_FPD → DDR</text>
  <path d="M1148 408 L1161 408" class="controlBi"/>
  <path d="M1326 452 L1326 468" class="control"/>
  <path d="M1339 607 L1339 632" class="control"/>
  <path d="M1629 607 L1629 632" class="flowBi"/>
  <path d="M1148 600 L1161 600" class="flowBi"/>
  <path d="M1797 875 C1838 875 1840 940 1810 940 L850 940 C835 940 840 971 831 971" class="control"/>
  <text x="1370" y="934" text-anchor="middle" class="small">irq_o only — direct PL → PS interrupt</text>
  <path d="M337 834 C382 834 389 933 444 933" fill="none" stroke="#8b98a7" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrowBlue)"/>
  <text x="381" y="901" text-anchor="middle" class="small">offline compare</text>

  <rect x="914" y="982" width="912" height="55" rx="10" fill="#173b5f"/>
  <text x="1370" y="1005" text-anchor="middle" class="whiteTitle">No-DSP source policy + acceptance contract — no post-synthesis proof yet</text>
  <text x="1370" y="1027" text-anchor="middle" class="whiteBody">use_dsp="no" · synthesis MAX_DSP=0 · acceptance fails if any DSP48/DSP58 primitive is present</text>
  <text x="960" y="1120" text-anchor="middle" class="subtitle">Runtime path: host prepares data → DDR → AXI control + memory → sequencer → engine blocks → DDR/output status</text>
</svg>
